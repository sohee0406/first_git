<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        // *조건문
        // =>조건에 다라 코드를 수행할지 말지 판단하여 실행함

        // *if(조건1){}
        // => 조건이참이면 블럭의 내용이 살행함

        // *else{}
        // =>if의 조건이 거짓힐때 실행됨

        // *else if(조건2){}
        // =>if와 조건이 거짓이고 그다음 조건으로 사용되며
        // 이 조건이 또한 거짓이면 else로 넘어감

        const num_1 = 'ㅇ';
        const num_2 = 1;

        if(num_1 > num_2){
            document.write('첫번째 입력한 숫자가 더 큽니다');
        }else if(num_1 === num_2){
            document.write('두 수가 같습니다')
        }else if(num_1 < num_2){
            document.write('두번째 입력한 숫자가 더 큽니다')
        }else{
            document.write('숫자만 입력 가능합니다')
        }

        

        

    </script>
</head>

</body>
</html>
