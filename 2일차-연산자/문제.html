<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        let num_1 = 10;
        const num_2 = 5;

        console.log('산술연산자: ' + (num_1 + num_2));
        
        console.log('증감연산자: ' + num_1++)

        console.log('복합대입 연산자: ' + (num_1 += + num_2));

        console.log('비교 연산자: ' + (num_1 > num_2));

        console.log('논리 연산자: ' + (num_1 > num_2 && num_1 < num_2));

        let a = 10;
        const b = 5;

        console.log(a + b);
        console.log(a - b);
        console.log(a / b)
        console.log(a * b)
        console.log(a > b && a < b)
        console.log(a++ + b)
        
        document.write('<h3>' + (a === b) + '</h3>')
        document.write('<h2> 두변수의 합은?: ' + (a + b) + '<h/2>')




        
    </script>
</head>
<body>
    
</body>
</html>
